name: ihere-production

x-api-environment: &api_environment
  NODE_ENV: production
  PORT: 4100
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  LOGIN_ALIAS_PEPPER: ${LOGIN_ALIAS_PEPPER:?LOGIN_ALIAS_PEPPER is required}
  CORS_ORIGINS: https://${I_HERE_DOMAIN:?I_HERE_DOMAIN is required}
  PUBLIC_WEB_URL: https://${I_HERE_DOMAIN:?I_HERE_DOMAIN is required}
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  SWAGGER_ENABLED: "false"
  AI_GENERATION_ENABLED: ${AI_GENERATION_ENABLED:-true}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-gpt-5.6-terra}
  AI_ESCALATION_MODEL: ${AI_ESCALATION_MODEL:-gpt-5.6-sol}
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  ANALYTICS_TOKEN_ENCRYPTION_KEY: ${ANALYTICS_TOKEN_ENCRYPTION_KEY:-}
  EXPORT_STORAGE_DIR: /app/storage/exports

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: builder
    restart: "no"
    working_dir: /app/apps/api
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      LOGIN_ALIAS_PEPPER: ${LOGIN_ALIAS_PEPPER:?LOGIN_ALIAS_PEPPER is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    command:
      [
        "node",
        "/app/apps/api/node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment: *api_environment
    volumes:
      - api_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [application, data]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:4100/api/v1/health/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4100
    ports:
      - "127.0.0.1:${I_HERE_WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      I_HERE_DOMAIN: ${I_HERE_DOMAIN:?I_HERE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [application]

networks:
  application:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  api_storage:
  caddy_data:
  caddy_config:
