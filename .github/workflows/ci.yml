name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ihere
          POSTGRES_USER: ihere
          POSTGRES_PASSWORD: ihere_local_only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U ihere -d ihere"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ihere:ihere_local_only@localhost:54329/ihere
        run: pnpm db:generate

      - name: Validate production Compose and Dockerfiles
        env:
          I_HERE_DOMAIN: ci.ihere.invalid
          POSTGRES_DB: ihere
          POSTGRES_USER: ihere
          POSTGRES_PASSWORD: ci-only-postgres-password-2026
          REDIS_PASSWORD: ci-only-redis-password-2026
          JWT_ACCESS_SECRET: ci-only-jwt-secret-with-more-than-32-characters
          LOGIN_ALIAS_PEPPER: ci-only-login-pepper-with-more-than-32-characters
          OPENAI_API_KEY: ci-only-not-a-real-openai-credential
        run: |
          docker compose -f infra/compose.production.yaml config --quiet
          docker build --check -f infra/Dockerfile.api .
          docker build --check -f infra/Dockerfile.web .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Application builds
        run: pnpm build

      - name: API end-to-end tests
        run: pnpm --filter api test:e2e
